name: NeonCompass
options:
  bundleIdPrefix: co.antoineteston
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIUserInterfaceStyle: Dark
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
targets:
  NeonCompass:
    type: application
    platform: iOS
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: NeonCompass/NeonCompass.entitlements
    sources:
      - path: NeonCompass
        excludes:
          - "Resources/MapTiles/**"
      - path: NeonCompass/Resources/MapTiles
        type: folder
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseRemoteConfig
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFunctions
  NeonCompassTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NeonCompassTests]
    dependencies:
      - target: NeonCompass
