name: NeonCompass
options:
  bundleIdPrefix: co.antoineteston
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    # Previously unset (relying on Xcode/xcodebuild's implicit defaults), which silently
    # produced an Info.plist with no CFBundleVersion/CFBundleShortVersionString at all.
    # The main app tolerated this for local installs, but adding the widget extension
    # target surfaced it as a hard failure: the simulator's app-extension placeholder
    # validation requires CFBundleVersion (com.apple.CoreSimulator: "bundleVersion must be
    # set in placeholder attributes for an app extension placeholder"), and an extension's
    # CFBundleVersion must match its containing app's — so both need this set explicitly.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    INFOPLIST_KEY_NSUserTrackingUsageDescription: "This lets us show ads relevant to you instead of generic ones."
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 13.0.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    from: 3.0.0
targets:
  NeonCompass:
    type: application
    platform: iOS
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: NeonCompass/NeonCompass.entitlements
        # GADApplicationIdentifier has no Apple-recognized INFOPLIST_KEY_* mapping, so it can't be
        # synthesized via GENERATE_INFOPLIST_FILE alone (verified: INFOPLIST_KEY_GADApplicationIdentifier
        # is silently dropped). Xcode merges GENERATE_INFOPLIST_FILE's synthesized keys with a
        # partial INFOPLIST_FILE when both are set, so this small file carries only that one key.
        INFOPLIST_FILE: NeonCompass/Support/Info-Ads.plist
      configs:
        # Expose le dossier Documents dans l'app Fichiers, pour récupérer les
        # brouillons du mode éditeur sans compte ni Firestore. DEBUG seulement :
        # l'app publiée n'a aucune raison d'ouvrir son dossier au monde.
        Debug:
          INFOPLIST_KEY_UIFileSharingEnabled: YES
          INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
    sources:
      - path: NeonCompass
        excludes:
          - "Resources/MapArt/**"
          - "Resources/POI/**"
          - "Resources/Cheats/**"
      - path: NeonCompass/Resources/MapArt
        type: folder
      # Référence de dossier, comme MapArt : sans `type: folder` XcodeGen
      # aplatit seed-poi.json à la racine du bundle, et le
      # `subdirectory: "POI"` de POILoader.loadSeed ne le trouve jamais — la
      # carte se retrouvait alors sans le moindre POI.
      - path: NeonCompass/Resources/POI
        type: folder
      # Même raison que POI : sans `type: folder`, XcodeGen aplatit
      # seed-cheats.json à la racine du bundle et le `subdirectory: "Cheats"` du
      # chargeur ne le trouve jamais — l'écran Codes redeviendrait vide au
      # premier lancement, exactement le défaut que ce socle corrige.
      - path: NeonCompass/Resources/Cheats
        type: folder
      # WidgetSummary.swift lives under NeonCompassWidgets/ on disk (its natural home
      # alongside the rest of the widget extension) but is compiled into BOTH targets —
      # XcodeGen supports the same file path appearing in two targets' `sources:` without
      # duplicating it on disk.
      - path: NeonCompassWidgets/WidgetSummary.swift
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseRemoteConfig
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseMessaging
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
      - target: NeonCompassWidgets
        embed: true
  NeonCompassWidgets:
    type: app-extension
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.antoineteston.NeonCompass.NeonCompassWidgets
        CODE_SIGN_ENTITLEMENTS: NeonCompassWidgets/NeonCompassWidgets.entitlements
        # NSExtension has no INFOPLIST_KEY_* mapping either (same reasoning as
        # GADApplicationIdentifier above) — see NeonCompassWidgets/Support/Info-Extension.plist.
        INFOPLIST_FILE: NeonCompassWidgets/Support/Info-Extension.plist
    sources:
      - path: NeonCompassWidgets
      # Shared design-system views/colors/type used by the widget's UI. Verified
      # Firebase/UIKit-free (pure SwiftUI + Foundation), so safe to compile into this
      # target too rather than duplicating a widget-local copy.
      - path: NeonCompass/Core/DesignSystem/ProgressRing.swift
      - path: NeonCompass/Core/DesignSystem/NCColor.swift
      - path: NeonCompass/Core/DesignSystem/NCTypography.swift
      - path: NeonCompass/Resources/Localizable.xcstrings
  NeonCompassTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NeonCompassTests]
    dependencies:
      - target: NeonCompass
