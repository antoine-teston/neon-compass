name: NeonCompass
options:
  bundleIdPrefix: co.antoineteston
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"
    # Sans ces deux clés, tout build sur appareil s'arrête avant de compiler, sur
    # « Signing for "NeonCompass" requires a development team ». Les régler dans l'UI
    # Xcode ne tient pas : `xcodegen generate` réécrit le projet et les efface — leur
    # seule place durable est ici. Le simulateur n'en a jamais eu besoin (signature
    # ad-hoc, aucun profil), ce qui explique que la CI soit restée verte : elle ne
    # construit que pour `generic/platform=iOS Simulator`.
    #
    # 392Z7YMFM8 est l'équipe personnelle GRATUITE. Elle suffit à faire passer cette
    # étape, pas à installer l'app : vérifié le 2026-08-17, elle ne provisionne ni
    # Sign in with Apple, ni les push, ni les App Groups — soit les trois entitlements
    # de NeonCompass.entitlements. Le build device échoue donc maintenant sur le vrai
    # motif (« Personal development teams […] do not support ») au lieu de le masquer.
    # LE JOUR DE L'ADHÉSION PAYANTE : remplacer cet ID par celui de l'équipe payante
    # (Xcode → Settings → Accounts, l'inscription en crée une NOUVELLE, l'ID change).
    # C'est le seul geste — voir docs/ops/2026-07-27-editeur-interne.md §0.
    DEVELOPMENT_TEAM: 392Z7YMFM8
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    # Previously unset (relying on Xcode/xcodebuild's implicit defaults), which silently
    # produced an Info.plist with no CFBundleVersion/CFBundleShortVersionString at all.
    # The main app tolerated this for local installs, but adding the widget extension
    # target surfaced it as a hard failure: the simulator's app-extension placeholder
    # validation requires CFBundleVersion (com.apple.CoreSimulator: "bundleVersion must be
    # set in placeholder attributes for an app extension placeholder"), and an extension's
    # CFBundleVersion must match its containing app's — so both need this set explicitly.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    INFOPLIST_KEY_NSUserTrackingUsageDescription: "This lets us show ads relevant to you instead of generic ones."
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.54.0
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 13.0.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    from: 3.0.0
targets:
  NeonCompass:
    type: application
    platform: iOS
    settings:
      base:
        # Sans cette clé, CFBundleDisplayName tombe sur PRODUCT_NAME et l'écran
        # d'accueil affiche « NeonCompass », sans espace. C'est le nom de l'ICÔNE,
        # tronqué au-delà d'une douzaine de caractères — à ne pas confondre avec le
        # nom App Store (« Neon Compass: GTA 6 Companion », 30 caractères, localisé
        # par boutique), qui vit dans App Store Connect et pas dans ce dépôt. Voir
        # docs/superpowers/specs/2026-08-08-nom-app-usage-nominatif-design.md.
        INFOPLIST_KEY_CFBundleDisplayName: Neon Compass
        # Sans cette clé, `actool` compile bien le catalogue mais ne désigne aucun
        # jeu d'icônes comme étant CELUI de l'app : rien n'est écrit dans
        # CFBundleIcons et l'écran d'accueil garde la vignette grise par défaut,
        # sans erreur ni avertissement de build. Elle nomme un jeu du catalogue,
        # pas un fichier.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: NeonCompass/NeonCompass.entitlements
        # GADApplicationIdentifier has no Apple-recognized INFOPLIST_KEY_* mapping, so it can't be
        # synthesized via GENERATE_INFOPLIST_FILE alone (verified: INFOPLIST_KEY_GADApplicationIdentifier
        # is silently dropped). Xcode merges GENERATE_INFOPLIST_FILE's synthesized keys with a
        # partial INFOPLIST_FILE when both are set, so this small file carries only that one key.
        INFOPLIST_FILE: NeonCompass/Support/Info-Ads.plist
      configs:
        # Expose le dossier Documents dans l'app Fichiers, pour récupérer les
        # brouillons du mode éditeur sans compte ni base distante. DEBUG seulement :
        # l'app publiée n'a aucune raison d'ouvrir son dossier au monde.
        Debug:
          INFOPLIST_KEY_UIFileSharingEnabled: YES
          INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
          # App ID de TEST de Google. Il doit rester cohérent avec les unités
          # servies par AdUnits en Debug — voir Core/Ads/AdUnits.swift.
          GAD_APP_ID: "ca-app-pub-3940256099942544~1458002511"
        Release:
          # TODO(ops) : remplacer par l'App ID réel à la création du compte AdMob.
          GAD_APP_ID: "ca-app-pub-3940256099942544~1458002511"
    sources:
      - path: NeonCompass
        excludes:
          - "Resources/MapArt/**"
          - "Resources/MapTiles/**"
          - "Resources/POI/**"
          - "Resources/Cheats/**"
      - path: NeonCompass/Resources/MapArt
        type: folder
      # Même raison que MapArt : `type: folder` préserve l'arborescence
      # <nom>/<côté>/<x>_<y>.png, dont dépend le `subdirectory:` de
      # MapTileManifest.load. Aplatie, elle mettrait 2 351 fichiers homonymes
      # à la racine du paquet.
      - path: NeonCompass/Resources/MapTiles
        type: folder
      # Référence de dossier, comme MapArt : sans `type: folder` XcodeGen
      # aplatit seed-poi.json à la racine du bundle, et le
      # `subdirectory: "POI"` de POILoader.loadSeed ne le trouve jamais — la
      # carte se retrouvait alors sans le moindre POI.
      - path: NeonCompass/Resources/POI
        type: folder
      # Même raison que POI : sans `type: folder`, XcodeGen aplatit
      # seed-cheats.json à la racine du bundle et le `subdirectory: "Cheats"` du
      # chargeur ne le trouve jamais — l'écran Codes redeviendrait vide au
      # premier lancement, exactement le défaut que ce socle corrige.
      - path: NeonCompass/Resources/Cheats
        type: folder
      # WidgetSummary.swift lives under NeonCompassWidgets/ on disk (its natural home
      # alongside the rest of the widget extension) but is compiled into BOTH targets —
      # XcodeGen supports the same file path appearing in two targets' `sources:` without
      # duplicating it on disk.
      - path: NeonCompassWidgets/WidgetSummary.swift
    dependencies:
      # Produit parapluie : Auth, PostgREST, Storage, Functions et Realtime.
      # Realtime n'est utilisé par aucune feature — aucun écran ne s'abonne à
      # des changements en direct — mais le parapluie évite d'énumérer quatre
      # produits qui bougeront au fil des versions du paquet.
      - package: Supabase
        product: Supabase
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
      - target: NeonCompassWidgets
        embed: true
  NeonCompassWidgets:
    type: app-extension
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.antoineteston.NeonCompass.NeonCompassWidgets
        CODE_SIGN_ENTITLEMENTS: NeonCompassWidgets/NeonCompassWidgets.entitlements
        # NSExtension has no INFOPLIST_KEY_* mapping either (same reasoning as
        # GADApplicationIdentifier above) — see NeonCompassWidgets/Support/Info-Extension.plist.
        INFOPLIST_FILE: NeonCompassWidgets/Support/Info-Extension.plist
    sources:
      - path: NeonCompassWidgets
      # Shared design-system views/colors/type used by the widget's UI. Verified
      # dependency-free (pure SwiftUI + Foundation), so safe to compile into this
      # target too rather than duplicating a widget-local copy.
      # Le type d'attributs de la Live Activity. ActivityKit EXIGE que l'app qui
      # démarre l'activité et l'extension qui la dessine voient le même type ;
      # il est donc compilé dans les deux cibles, et n'a pour cette raison
      # aucune dépendance — pas même `Cheat`.
      - path: NeonCompass/Core/LiveActivity/FavoritesActivityAttributes.swift
      - path: NeonCompass/Core/DesignSystem/ProgressRing.swift
      - path: NeonCompass/Core/DesignSystem/NCColor.swift
      - path: NeonCompass/Core/DesignSystem/NCTypography.swift
      - path: NeonCompass/Resources/Localizable.xcstrings
  NeonCompassTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NeonCompassTests]
    dependencies:
      - target: NeonCompass
schemes:
  # Schéma explicite pour UNE raison : attacher la configuration StoreKit locale
  # à l'action Run. Sans elle, `Product.products(for:)` ne rend rien au
  # simulateur — il n'y a pas d'App Store derrière — donc Pro est INACHETABLE et
  # tout ce qui en dépend (itinéraire, masquage des trouvés, épingles illimitées
  # et leur synchro) est invérifiable à la main.
  #
  # Elle ne vaut QUE pour l'exécution depuis Xcode et depuis ce schéma : le
  # binaire soumis à l'App Store ne la voit jamais, et `xcodebuild test` ne
  # l'utilise pas non plus. Ce n'est pas un contournement du paiement, c'est le
  # bac à sable que StoreKit prévoit pour ça.
  #
  # Le reste du schéma reproduit ce que XcodeGen générait tout seul — le déclarer
  # explicitement le remplace, il faut donc que la construction et les tests y
  # figurent, sans quoi `xcodebuild -scheme NeonCompass test` ne trouverait plus
  # de cible à exécuter et rapporterait « 0 tests » au lieu d'un échec.
  NeonCompass:
    build:
      targets:
        NeonCompass: all
        NeonCompassWidgets: all
    run:
      config: Debug
      storeKitConfiguration: NeonCompass/Support/NeonCompassPro.storekit
    test:
      config: Debug
      targets:
        - NeonCompassTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
