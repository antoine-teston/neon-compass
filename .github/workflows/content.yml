name: Contenu

# Deux jobs très différents :
#
# `check` tourne sur chaque PR touchant le contenu ou l'outillage. Il n'a besoin
# d'aucun credential — validation de schéma, règles éditoriales, et surtout
# vérification que les socles embarqués ne sont pas en retard sur content/. Ce
# dernier point est celui qui ne peut pas être attrapé à la relecture : un POI
# édité sans régénération de seed-poi.json livre un binaire dont le socle est en
# retard, et rien ne le signale.
#
# `publish` est en déclenchement MANUEL. Publier téléverse le contenu sur le CDN
# de production ; toute collection dont l'empreinte a changé prend une nouvelle
# version, et ses clients la retéléchargent.
#
# `publish-news` est l'exception, décidée le 2026-08-03 : l'ACTU et les
# ÉVÉNEMENTS EN LIGNE se publient tout seuls au merge sur `main`.
#
# Ce fichier portait la règle inverse — « jamais un effet de bord d'un merge ».
# Elle n'est pas abandonnée, elle est déplacée : la décision humaine existe
# toujours, c'est la RELECTURE DE LA PR de veille. Un bouton qui ne montre rien
# est un moins bon garde-fou qu'un diff qu'on relit. Et pour ces deux kinds, la
# fraîcheur EST la fonctionnalité : un compte à rebours publié trois jours en
# retard n'est pas du contenu en retard, c'est du contenu faux.
#
# Ce qui garde son bouton, et pourquoi : POI, cheats, guides et collections sont
# embarqués dans les socles de l'app. Une erreur y coûte un binaire à reprendre,
# pas un fragment à republier. Le job REFUSE de partir si le merge les touche.
#
# Le build iOS n'est délibérément pas ici : la spec §11 tranche « CI : Xcode Cloud
# plus tard, build locale + TestFlight en v1 ». Ce workflow ne couvre que la
# chaîne de contenu, qui est du Node pur.

on:
  pull_request:
    paths:
      - 'content/**'
      - 'tools/**'
      - 'NeonCompass/Resources/POI/**'
      - '.github/workflows/content.yml'
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'tools/**'
      - 'NeonCompass/Resources/POI/**'
  workflow_dispatch:
    inputs:
      publish:
        description: "Publier réellement vers le CDN (sinon, contrôles seuls)"
        type: boolean
        default: false

# Lecture seule par défaut. Les deux jobs de publication rehaussent eux-mêmes ce
# dont ils ont besoin : reporter le verrou de versions demande un push.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # gtav-poi-ids.mjs n'a aucune dépendance : ses tests tournent sans install.
      # C'est délibéré — ils portent l'invariant le plus coûteux du dépôt (un id
      # publié ne doit jamais désigner un autre POI), donc rien ne doit pouvoir
      # les rendre inexécutables.
      - name: Tests de frappe des identifiants
        run: node --test tools/basemap/gtav-poi-ids.test.mjs

      # Surface d'attaque de la console web locale : liste blanche d'actions et
      # refus des identifiants hostiles. Sans dépendance non plus.
      #
      # Les deux transformations de matérialisation tournent ici pour la même
      # raison : elles portent l'idempotence des runs (`processedFrom`), donc un
      # doublon silencieux dans le fil ou la carte. Elles n'ont aucune dépendance
      # — rien ne doit pouvoir les rendre inexécutables.
      #
      # La politique de sources les rejoint : c'est elle qui empêche la veille
      # d'interroger un domaine dont le robots.txt nous exclut. Une règle de
      # conformité qui ne serait vérifiée nulle part ne vaudrait pas mieux que
      # le paragraphe de prompt qu'elle remplace.
      - name: Tests de la console web, des matérialisations et de la politique de sources
        run: >
          node --test
          tools/content-cli/ui/actions.test.mjs
          tools/content-cli/draft-to-poi.test.mjs
          tools/content-cli/facts-to-news.test.mjs
          tools/content-cli/facts-to-online-event.test.mjs
          tools/content-cli/source-policy.test.mjs

      - name: Installer les dépendances du CLI
        working-directory: tools/content-cli
        run: npm ci

      # `npm test` et pas `npm run check` : le script de test globe désormais TOUS
      # les fichiers de test avant d'enchaîner sur les contrôles de contenu. Les
      # étapes ci-dessus restent, et ce n'est pas une redite — elles tournent
      # AVANT `npm ci`, pour qu'une panne d'installation ne puisse pas rendre
      # inexécutables les invariants les plus coûteux du dépôt.
      #
      # Sans cette étape, gtav-cheats.test.mjs et cdn-build.test.mjs — vingt
      # tests — ne tournaient sur AUCUNE pull request : la seule commande qui les
      # atteignait vivait dans le workflow de veille, déclenché par cron.
      # Une régression y aurait été vue après la fusion, pas avant.
      - name: Suite complète et contrôles de contenu
        working-directory: tools/content-cli
        run: npm test

  # Publication automatique de l'actu et des événements en ligne au merge.
  #
  # Le `needs: check` est le même mur que pour la publication manuelle : schémas,
  # règles éditoriales, marques déposées, socles à jour. Rien ne part sans lui.
  publish-news:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      # `fetch-depth: 0` : on compare le merge à son parent pour savoir CE QUI a
      # changé. Un clone superficiel n'a pas le parent.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Le garde-fou de périmètre. `content/inbox/` est exclu à dessein : il
      # n'est publié par aucun kind, c'est la matière première de la veille.
      #
      # Un merge qui touche AUSSI un POI ou un cheat ne publie rien du tout, et
      # le dit. Publier « juste l'actu » dans ce cas serait un mensonge : le
      # verrou de versions est global, et une collection dont l'empreinte a
      # bougé repartirait avec elle.
      - name: Le merge reste-t-il dans le périmètre de la veille
        id: scope
        run: |
          set -euo pipefail
          CHANGED="$(git diff --name-only '${{ github.event.before }}' '${{ github.sha }}' -- content/ || true)"
          if [ -z "$CHANGED" ]; then
            echo "hors-perimetre=aucun changement de contenu" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HORS="$(echo "$CHANGED" | grep -vE '^content/(news|online-events|inbox)/|^content/cdn-versions\.json$' || true)"
          if [ -n "$HORS" ]; then
            {
              echo 'hors-perimetre<<EOF'
              echo "$HORS"
              echo EOF
            } >> "$GITHUB_OUTPUT"
          fi
          PUBLIABLE="$(echo "$CHANGED" | grep -E '^content/(news|online-events)/' || true)"
          [ -n "$PUBLIABLE" ] && echo 'a-publier=oui' >> "$GITHUB_OUTPUT" || true

      # Se dégrader proprement, comme le reste de la chaîne : sans identifiants,
      # on ne tente pas et on le DIT. Un `main` rouge à chaque merge d'actu
      # apprendrait surtout à ignorer le rouge.
      #
      # Ce n'est pas une hypothèse d'école : au 2026-08-03, ces secrets n'existent
      # pas encore et le job `publish` n'a jamais tourné une seule fois.
      - name: Vérifier les identifiants de publication
        id: creds
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo 'presents=oui' >> "$GITHUB_OUTPUT"
          else
            {
              echo '### Publication automatique : impossible'
              echo
              echo 'SUPABASE_URL et/ou SUPABASE_SERVICE_ROLE_KEY manquent dans'
              echo "l'environnement \`production\`. Le contenu est sur \`main\`, mais il"
              echo "n'a PAS été publié sur le CDN."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Publication non tentée::Identifiants Supabase absents de l'environnement production."
          fi

      - name: Expliquer pourquoi rien n'est publié
        if: steps.scope.outputs.hors-perimetre != '' || steps.scope.outputs.a-publier != 'oui'
        run: |
          {
            echo '### Publication automatique : non'
            echo
            if [ -n '${{ steps.scope.outputs.hors-perimetre }}' ]; then
              echo 'Ce merge sort du périmètre de la veille (actu + événements en ligne) :'
              echo '```'
              echo '${{ steps.scope.outputs.hors-perimetre }}'
              echo '```'
              echo 'Ces kinds sont embarqués dans les socles de l’app — ils gardent leur'
              echo 'publication manuelle. Lancer le workflow `Contenu` avec la case cochée.'
            else
              echo 'Aucune actu ni événement en ligne dans ce merge.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Installer les dépendances du CLI
        if: steps.scope.outputs.hors-perimetre == '' && steps.scope.outputs.a-publier == 'oui' && steps.creds.outputs.presents == 'oui'
        working-directory: tools/content-cli
        run: npm ci

      - name: Publier
        if: steps.scope.outputs.hors-perimetre == '' && steps.scope.outputs.a-publier == 'oui' && steps.creds.outputs.presents == 'oui'
        working-directory: tools/content-cli
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run release

      # Même raison que pour la publication manuelle : un verrou qui diverge du
      # dépôt ferait repartir TOUTES les collections au run suivant, donc un
      # retéléchargement complet chez tous les clients, pour rien.
      #
      # `[skip ci]` : ce commit ne touche que le verrou, et se relancer dessus
      # ferait boucler le workflow sur lui-même.
      - name: Reporter le verrou de versions
        if: steps.scope.outputs.hors-perimetre == '' && steps.scope.outputs.a-publier == 'oui' && steps.creds.outputs.presents == 'oui'
        run: |
          set -euo pipefail
          if ! git diff --quiet content/cdn-versions.json; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add content/cdn-versions.json
            git commit -m "chore(content): versions de collections après publication [skip ci]"
            git push origin HEAD:main
          fi

  publish:
    # Uniquement sur déclenchement manuel avec la case cochée. Le `needs` garantit
    # qu'on ne publie jamais un contenu qui ne passe pas les contrôles.
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: check
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Installer les dépendances du CLI
        working-directory: tools/content-cli
        run: npm ci

      # SUPABASE_URL et SUPABASE_SERVICE_ROLE_KEY vivent dans Settings > Secrets
      # and variables > Actions. La clé `service_role` contourne RLS : elle ne
      # doit exister QUE là — jamais dans le dépôt, jamais dans le binaire de
      # l'app, qui n'emporte que la clé anonyme.
      - name: Publier le contenu sur le CDN
        working-directory: tools/content-cli
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run release

      # Le verrou de versions change dès qu'une collection change. Le laisser
      # diverger du dépôt ferait repartir TOUTES les collections à la version
      # suivante au prochain run — donc un retéléchargement complet chez tous
      # les clients, pour rien.
      - name: Reporter le verrou de versions
        run: |
          if ! git diff --quiet content/cdn-versions.json; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add content/cdn-versions.json
            git commit -m "chore(content): versions de collections après publication"
            git push
          fi

      # Les migrations SQL ne sont PAS ici. Elles ont leur propre workflow,
      # `Migrations` — voir son en-tête pour le pourquoi. Résumé : ce sont deux
      # opérations sans rapport, aux identifiants distincts, et les mêler a
      # coûté deux runs rouges le 2026-08-03 alors que la publication du contenu
      # avait parfaitement réussi les deux fois.
