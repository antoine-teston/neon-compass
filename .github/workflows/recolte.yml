name: Récolte

# La moitié DÉTERMINISTE de la veille : rapporter des octets. Aucun modèle,
# aucune clé d'API, aucune décision éditoriale.
#
# Pourquoi ce workflow existe séparément de `Veille quotidienne` :
#
# La veille a besoin de deux choses qui ne vivent pas au même endroit.
#
#   - Le RÉSEAU. Les quatre sources du registre ne sont joignables que depuis un
#     runner CI. La passerelle de sortie des sessions d'agent refuse le CONNECT
#     sur ces domaines (403 sur les quatre à la fois, runs des 21/07, 27/07 et
#     03/08 — voir PR #55, qui le confirme via `$HTTPS_PROXY/__agentproxy/status`).
#   - Le JUGEMENT. Décider qu'un titre mérite un fait, et le reformuler, demande
#     un modèle. La Routine cloud en a un, gratuitement, sans clé d'API.
#
# Aucune des deux moitiés ne peut faire le travail de l'autre, et rien ne les
# réunira : l'une est bloquée réseau, l'autre coûterait une clé d'API sur le
# runner. Ce workflow est donc la moitié réseau.
#
# La récolte voyage par la branche jetable `veille/recolte`, PAS par l'artefact :
# la Routine ne joint que `api.github.com`, et télécharger un artefact redirige
# vers un CDN Azure qu'elle ne joint pas. Détail à l'étape « Déposer la récolte ».
#
# ─────────────────────────────────────────────────────────────────────────────
# L'artefact contient du TEXTE DE TIERS, et c'est pourquoi il n'est pas commité.
#
# Le dépôt ne doit contenir que nos reformulations — c'est la contrainte IP du
# projet, pas une préférence. `retention-days: 1` est donc structurel : le texte
# des articles transite, il ne séjourne pas.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      since:
        description: 'Fenêtre en jours'
        type: string
        default: '2'
      max:
        description: 'Plafond global de pages rapportées'
        type: string
        default: '15'
  # Le cron n'est PAS l'ordonnanceur de la veille — la Routine l'est, et elle
  # déclenche ce workflow elle-même. Celui-ci sert de filet : si la Routine ne
  # part pas, la récolte du jour existe quand même en artefact, et le préflight
  # aura signalé une source fermée.
  #
  # Il se voulait « décalé de quelques minutes avant la Routine » ; en réalité
  # GitHub retarde un cron de 50 à 130 minutes, donc ce run part APRÈS elle.
  # C'est ainsi que les 13-15/08 la branche de transport a été recréée dix
  # minutes après le nettoyage de la Routine, et y est restée la journée sur un
  # dépôt public. D'où la règle à l'étape de dépôt : un run planifié ne pousse
  # JAMAIS la branche de transport — l'artefact lui suffit.
  schedule:
    - cron: '47 1 * * *'

concurrency:
  group: recolte
  cancel-in-progress: false

# `contents: write` sert UNIQUEMENT à pousser la branche de transport
# `veille/recolte` (voir l'étape correspondante). Ce workflow n'ouvre aucune PR
# et ne touche jamais à `main`.
permissions:
  contents: write

jobs:
  recolte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Avant tout : les sources répondent-elles ? Ici l'echec est franc et
      # gratuit. `fetch-source.mjs` distingue lui-même un refus des sources d'un
      # blocage de notre propre sortie réseau, et le dit dans son message.
      - name: Préflight
        run: node tools/content-cli/fetch-source.mjs preflight

      # Aucune dépendance npm : `fetch-source.mjs` n'utilise que des modules
      # natifs de Node et `source-policy.mjs`. C'est délibéré — la moitié réseau
      # de la veille ne doit pas pouvoir tomber sur une installation.
      - name: Récolter flux et pages
        run: |
          node tools/content-cli/fetch-source.mjs harvest \
            --out "$RUNNER_TEMP/recolte" \
            --since '${{ inputs.since || 2 }}' \
            --max '${{ inputs.max || 15 }}' \
            2>&1 | tee "$RUNNER_TEMP/recolte.log"

      # La semaine du mode en ligne est déjà STRUCTURÉE par la source : elle n'a
      # pas besoin d'un modèle, seulement du réseau. Elle voyage donc dans le
      # même artefact, en fait d'inbox prêt à copier — la Routine n'aura qu'à le
      # déposer dans content/inbox/.
      #
      # `continue-on-error` : une dérive du hub ne doit pas emporter la récolte
      # d'actu avec elle. Décision maintenue le 2026-08-06 — mais avec sa
      # contrepartie, qui manquait : **l'API `actions/runs/<id>/jobs` rapporte
      # `conclusion: success` pour une étape tolérante sortie en code 1.** Quatre
      # runs se sont annoncés verts alors que deux avaient échoué. Le statut de
      # l'étape ne dit donc RIEN ; c'est `weekly.json` qui fait autorité.
      #
      # `--capture` dépose ce verdict, et le HTML du hub avec lui, dans le
      # répertoire dont la branche de transport est faite. Deux raisons :
      #
      #   1. La Routine sait POURQUOI il n'y a pas de semaine. Sans ça, un fichier
      #      de faits absent parce que cassé est indiscernable pour elle d'un
      #      fichier absent parce qu'il n'y avait rien de neuf — c'est ce qui a
      #      laissé la panne du 06/08 courir une journée.
      #   2. Un échec qui détruit sa preuve force le diagnostic à la main. Le HTML
      #      capturé est aussi la fixture attendue pour réancrer l'extracteur sur
      #      une semaine vivante.
      - name: Semaine du mode en ligne
        id: weekly
        continue-on-error: true
        run: |
          set -o pipefail
          node tools/content-cli/fetch-source.mjs weekly --write \
            --capture "$RUNNER_TEMP/recolte" 2>&1 | tee -a "$RUNNER_TEMP/recolte.log"
          cp content/inbox/*-gtav-weekly.facts.json "$RUNNER_TEMP/recolte/" 2>/dev/null || true

      # L'artefact reste, pour l'humain qui débogue un run. Il n'est PLUS le
      # chemin par lequel la Routine récupère la récolte : son téléchargement
      # redirige vers un CDN Azure (`*.blob.core.windows.net`) que la passerelle
      # de sortie des sessions d'agent refuse au CONNECT — constaté le
      # 2026-08-03, run 30812422696. Voir l'étape suivante.
      - name: Publier la récolte en artefact
        uses: actions/upload-artifact@v4
        with:
          name: recolte
          path: ${{ runner.temp }}/recolte
          # Structurel, pas une économie de stockage : voir l'en-tête. Le texte
          # de tiers transite, il ne séjourne pas.
          retention-days: 1

      # Le transport RÉEL vers la Routine.
      #
      # Elle ne joint que `api.github.com`. L'API `contents` y rend le fichier
      # dans sa réponse, sans redirection — c'est donc le seul chemin praticable,
      # et il suppose que la récolte soit dans le dépôt.
      #
      # Trois précautions, parce que ce sont des pages écrites par des tiers :
      #
      #   1. `git init` dans le répertoire de récolte, pas un commit sur le
      #      dépôt cloné. La branche est ORPHELINE — aucune histoire commune avec
      #      `main`, donc une fusion accidentelle est impossible, pas seulement
      #      improbable.
      #   2. `--force`, une seule fois par jour : la récolte de la veille est
      #      écrasée, elle ne s'accumule pas.
      #   3. La Routine supprime la branche après lecture — et depuis le
      #      2026-08-15, `recolte-nettoyage.yml` balaie ce qui séjourne plus de
      #      deux heures, parce que la session cloud des 14-15/08 n'avait aucun
      #      outil pour supprimer une ref et que la branche est restée exposée
      #      une journée entière, deux jours de suite.
      #
      # `if:` — seul un run DÉCLENCHÉ (la chaîne de veille, ou une main humaine)
      # dépose le transport. Laisser le run planifié pousser aussi, c'était
      # recréer la branche APRÈS le nettoyage de la Routine (voir le commentaire
      # du cron), pour un lecteur qui n'existe pas : la Routine ne lit que la
      # récolte de SON dispatch.
      - name: Déposer la récolte sur la branche de transport
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/recolte"
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "recolte: transport du $(date -u +%Y-%m-%d) — BRANCHE JETABLE, NE PAS FUSIONNER"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/veille/recolte
          echo "récolte déposée sur veille/recolte ($(du -sh recolte.json | cut -f1) de bundle)"

      - name: Compte-rendu
        if: always()
        run: |
          {
            echo '### Récolte'
            echo
            echo '```'
            cat "$RUNNER_TEMP/recolte.log" 2>/dev/null || echo '(aucune sortie)'
            echo '```'
            echo
            echo '### Mode en ligne'
            echo
            WEEKLY="$RUNNER_TEMP/recolte/weekly.json"
            if [ ! -f "$WEEKLY" ]; then
              echo '> Aucun verdict écrit — l’étape n’est pas allée jusqu’au bout.'
              echo '> Ni « pas de semaine » ni « structure changée » : quelque chose a coupé avant.'
            else
              VERDICT="$(jq -r '.verdict' "$WEEKLY")"
              MESSAGE="$(jq -r '.message // ""' "$WEEKLY")"
              case "$VERDICT" in
                sans-semaine)
                  echo "**Aucune semaine publiée par la source.** Ce n’est pas une panne :"
                  echo "il n’y avait rien à récolter."
                  echo
                  echo "> La page se déclare « $MESSAGE »."
                  ;;
                sans-structure)
                  echo "**Récit publié, tableau absent.** Ce n’est pas une panne : la source"
                  echo "déclare elle-même ne pas publier le tableau structuré de la semaine."
                  echo "Pas de carte d’événement possible — la veille d’actu couvre le récit."
                  echo
                  echo "> La page se déclare « $MESSAGE »."
                  STORY="$(jq -r '.storyPath // ""' "$WEEKLY")"
                  [ -n "$STORY" ] && echo "> Récit de la semaine : \`$STORY\`."
                  ;;
                *)
                  echo "⚠️ **Verdict \`$VERDICT\`** — la semaine du mode en ligne n’a pas été récoltée."
                  echo
                  echo '```'
                  echo "$MESSAGE"
                  echo '```'
                  echo "Le HTML du hub est dans l’artefact (\`hub.html\`) — et sur \`veille/recolte\` si ce run a été déclenché à la main ou par la Routine."
                  ;;
              esac
            fi
          } >> "$GITHUB_STEP_SUMMARY"
