name: Migrations

# Applique les migrations SQL de `supabase/migrations/` au projet de production.
#
# Pourquoi ce workflow existe séparément de `Contenu`, décidé le 2026-08-03 :
#
# `supabase db push` y vivait, dans le job `publish`, juste après le téléversement
# du contenu. Deux opérations y étaient mêlées qui n'ont RIEN en commun :
#
#   - publier du contenu écrit des fragments dans Storage. Identifiants :
#     SUPABASE_URL + la clé de service. Réversible en republiant.
#   - appliquer des migrations change le SCHÉMA de la base. Identifiants : un
#     jeton de compte personnel + le mot de passe Postgres. Difficilement
#     réversible.
#
# Le prix de cette confusion s'est payé le jour même : un SUPABASE_ACCESS_TOKEN
# mal formé a fait échouer le job DEUX fois de suite alors que la publication du
# contenu avait réussi les deux fois. Un rouge qui ne dit pas ce qui a échoué
# n'apprend qu'une chose : à ignorer le rouge.
#
# MANUEL uniquement, et sans repli : contrairement à la publication de contenu,
# il n'y a pas de version de dégradation acceptable pour une migration. Ou elle
# s'applique, ou le run est rouge.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Lister ce qui serait appliqué, sans rien appliquer"
        type: boolean
        default: true
      # `supabase db push` REFUSE d'insérer une migration antérieure à la
      # dernière appliquée à distance, et demande `--include-all` pour le faire.
      # C'est un bon garde-fou : une migration qui s'insère avant une autre déjà
      # appliquée n'a pas été jouée dans l'ordre où elle a été relue, et ses
      # effets peuvent différer de ce qu'on croit.
      #
      # Il est donc exposé plutôt que neutralisé. Il a servi dès le premier
      # usage, le 2026-08-03 : `20260802170000_contribution_xp.sql` manquait en
      # production alors que la migration SUIVANTE avait été appliquée — un saut
      # que personne n'avait remarqué, et que `migration list` a rendu visible.
      include-all:
        description: "Appliquer aussi les migrations antérieures à la dernière appliquée (hors ordre)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: migrations
  cancel-in-progress: false

jobs:
  migrations:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      # ÉPINGLÉE, et non `latest`, depuis le 2026-08-07. La v2.112.0, publiée ce
      # matin-là, fait échouer `supabase link` sur TOUT projet : le schéma généré
      # que la CLI utilise pour décoder `GET /v1/projects/{ref}/api-keys` n'accepte
      # un `inserted_at` qu'avec un suffixe `Z`, alors que l'API le rend avec un
      # décalage (`+00:00`) sur les clés `publishable` et `secret`. La CLI est donc
      # plus stricte que l'API qu'elle décode, et aucun drapeau ne permet de sauter
      # la lecture des clés — que `link` met en cache sans que ce workflow s'en
      # serve. Amont : https://github.com/supabase/cli/issues/6115
      #
      # Repasser à `latest` quand l'issue est close ; laisser `latest` en attendant
      # rendrait ce workflow rouge à chaque tentative, pour une migration saine.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      # `dry-run` est le DÉFAUT, et coché à dessein : voir la liste avant de
      # l'appliquer doit être le geste normal, l'appliquer le geste délibéré.
      # `migration list` compare l'état local à l'état distant et n'écrit rien.
      - name: Lier le projet
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: État des migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -o pipefail
          supabase migration list --linked 2>&1 | tee "$RUNNER_TEMP/migrations.log"

      - name: Appliquer
        if: inputs.dry-run != true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -o pipefail
          supabase db push ${{ inputs.include-all && '--include-all' || '' }} 2>&1 | tee -a "$RUNNER_TEMP/migrations.log"

      # Le filet de sécurité du projet sur les privilèges : `pg_default_acl`
      # accorde tout à `anon` et `authenticated` sur chaque table créée, donc
      # toute migration porte sa propre révocation. Vérifié APRÈS application,
      # jamais en dry-run : c'est l'état RÉSULTANT qui compte.
      #
      # `privileges_test.sql` et NON `schema_test.sql`. La première version de
      # cette étape lançait le second, et c'était une faute : il est inséparable
      # de ses fixtures — il insère dans `auth.users`, `contributions`, `votes`,
      # `progression`, `editor_drafts` et modifie l'XP des profils. Le lancer
      # ici aurait injecté des données de test dans la base qui sert les
      # clients. `privileges_test.sql` porte les mêmes assertions en LECTURE
      # PURE, donc sûres contre la production.
      - name: Vérifier les deux verrous
        if: inputs.dry-run != true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::warning title=Verrous non vérifiés::SUPABASE_DB_URL absent — les privilèges des objets créés par ces migrations ne sont PAS contrôlés. Voir supabase/tests/privileges_test.sql."
            exit 0
          fi
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/privileges_test.sql 2>&1 | tee -a "$RUNNER_TEMP/migrations.log"

      - name: Compte-rendu
        if: always()
        run: |
          {
            echo "### Migrations"
            echo
            echo '```'
            cat "$RUNNER_TEMP/migrations.log" 2>/dev/null || echo '(aucune sortie)'
            echo '```'
            if [ '${{ inputs.dry-run }}' = 'true' ]; then
              echo
              echo '> Dry-run : **rien n’a été appliqué.** Relancer avec la case décochée.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
